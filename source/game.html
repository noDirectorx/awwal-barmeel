<style>
:root{--ink:#f7e7c8;--gold:#f2b84b;--rust:#a4481c;--night:rgba(24,12,6,.92);--sub:#c9b28c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:Almarai,Tahoma,sans-serif;color:var(--ink)}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;font-size:clamp(14px,2.5vmin + .4vw,24px)}

#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(3vh,env(safe-area-inset-top)) max(5vw,env(safe-area-inset-right)) max(3vh,env(safe-area-inset-bottom)) max(5vw,env(safe-area-inset-left));background-size:cover;background-position:center 62%;text-align:center;transition:opacity .7s;overflow:hidden}

#title>*{position:relative}#title .go{margin-top:1em}
#title h1{font:400 clamp(58px,16vmin,150px)/1.25 Lalezar,serif;margin:0;color:#fff4d8;text-shadow:0 .05em 0 #6e2c0c,0 .1em .3em rgba(0,0,0,.55)}
#title p{margin:0;font-weight:700;text-shadow:0 1px 3px #000,0 0 8px #000}
.menu{position:absolute!important;right:max(6vw,env(safe-area-inset-right));top:50%;transform:translateY(-44%);display:flex;flex-direction:column;align-items:flex-start;gap:.1em}
.mi{background:none;border:0;padding:.14em .3em;min-height:44px;font:700 clamp(25px,6.1vmin,50px)/1.3 "Aref Ruqaa",Almarai,serif;color:#fff4d8;text-shadow:0 2px 0 #4b1f07,0 3px 10px rgba(0,0,0,.75);cursor:pointer;transition:color .15s,transform .15s}
.mi:hover,.mi:active{color:var(--gold);transform:translateX(-.3em)}

#panel{position:absolute;inset:0;background:rgba(14,6,2,.86);display:flex;align-items:center;justify-content:center;padding:1em;overflow:auto;touch-action:auto}
#panel>div{width:min(36em,96%);max-height:96%;overflow:auto;touch-action:pan-y}

#panel .row{display:flex;align-items:center;justify-content:space-between;gap:1em;background:rgba(255,235,190,.08);border-radius:.5em;padding:.6em .9em;margin-bottom:.5em}
#panel .row b{display:block}#panel .row small{opacity:.75}
#panel .row.off{opacity:.5}
#panel input[type=range]{width:45%;accent-color:var(--gold);touch-action:auto;min-height:36px}
#panel .seg{display:flex;gap:.3em}#panel .seg button{min-height:40px;padding:.3em .8em;border:0;border-radius:.4em;background:rgba(255,235,190,.15);color:var(--ink);font:700 .9em Almarai,sans-serif}#panel .seg button.on{background:var(--gold);color:#2b1205}
#panel .note{opacity:.7;font-size:.82em;margin:.2em 0 .8em;line-height:1.6}
#panel a{color:var(--gold);font-weight:800;direction:ltr;display:inline-block;user-select:text;-webkit-user-select:text}
#leave{position:absolute;top:max(1.4vmin,env(safe-area-inset-top));left:max(2vw,env(safe-area-inset-left));font-size:.85em;min-height:44px;padding:.4em 1em}
#trophy{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:linear-gradient(#4b2a0c,#22110a);border:2px solid var(--gold);border-radius:.7em;padding:.7em 1.5em;text-align:center;pointer-events:none;transition:opacity .4s;white-space:nowrap}
#trophy b{font:400 1.45em Lalezar,serif;color:var(--gold);display:block}
.btn{font:800 1.05em Almarai,sans-serif;color:#2b1205;background:var(--gold);border:0;border-bottom:.22em solid #94591a;border-radius:.5em;padding:.65em 1.5em;min-height:48px;cursor:pointer}
.btn:active{transform:translateY(.12em);border-bottom-width:.1em}
.btn.ghost{background:rgba(24,12,6,.75);color:var(--ink);border-color:#000}
#dlg{position:absolute;right:max(3vw,env(safe-area-inset-right));left:max(3vw,env(safe-area-inset-left));bottom:max(2.2vmin,env(safe-area-inset-bottom));min-height:7.2em;background:var(--night);border:2px solid #8a5a26;border-radius:.6em;padding:.75em 1em .75em 1em;display:flex;gap:1em;align-items:flex-start;cursor:pointer}
#dlg img{height:6.4em;width:auto;align-self:flex-end;margin:-1.9em 0 -.75em;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));flex:none}
#dlg .t{flex:1;min-width:0}
#dlg b{font:400 1.25em/1.1 Lalezar,serif;color:var(--gold);display:block;margin-bottom:.15em}
#dlg span{font-weight:700;line-height:1.6;display:block}
#dlg i{position:absolute;left:.9em;bottom:.7em;width:0;height:0;border-style:solid;border-width:.42em .62em .42em 0;border-color:transparent var(--gold) transparent transparent;animation:nd 1s infinite}
@keyframes nd{50%{transform:translateY(-3px)}}

#choices h3{font:400 1.45em Lalezar,serif;color:#fff4d8;margin:0 0 .2em;text-align:center;text-shadow:0 2px 4px #000}
#choices .btn{width:min(30em,92%);line-height:1.4}
#choices small{display:block;font-weight:400;font-size:.8em;opacity:.8}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;font:400 clamp(30px,8vmin,72px) Lalezar,serif;color:#fff4d8;text-shadow:0 3px 8px #000;padding:1em}
#card small{font:700 .38em/1.7 Almarai,sans-serif;display:block;margin-top:.4em;max-width:34em}
#hud{position:absolute;top:max(1.4vmin,env(safe-area-inset-top));right:max(2vw,env(safe-area-inset-right));left:max(2vw,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:1em}
#tasks{background:rgba(24,12,6,.72);border-radius:.5em;padding:.45em .75em;font-size:.82em;line-height:1.55;max-width:44%}
#tasks b{color:var(--gold);font-family:Lalezar,serif;font-weight:400;font-size:1.15em}
#tasks div.done{opacity:.5;text-decoration:line-through}
#stat{background:rgba(24,12,6,.72);border-radius:.5em;padding:.45em .75em;font-size:.82em;font-weight:700;direction:rtl}
#act{position:absolute;left:max(4vw,env(safe-area-inset-left));bottom:max(4vmin,env(safe-area-inset-bottom));font-size:1.05em}
#float{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(24,12,6,.85);padding:.35em .9em;border-radius:.5em;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .3s}
#skip{position:absolute;top:max(1.4vmin,env(safe-area-inset-top));left:max(2vw,env(safe-area-inset-left));font-size:.75em;min-height:36px;padding:.4em .9em;border-bottom-width:0}
#hold{position:absolute;left:50%;bottom:max(4vmin,env(safe-area-inset-bottom));transform:translateX(-50%);overflow:hidden;touch-action:none}
#hold u{position:absolute;right:0;top:0;bottom:0;background:rgba(255,255,255,.55);width:0;text-decoration:none;pointer-events:none}
#hold em{position:relative;font-style:normal}
#letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);cursor:pointer}
#letter div{position:relative;width:min(84vw,120vmin);aspect-ratio:944/499;background-size:100% 100%;display:flex;align-items:center;justify-content:center;padding:6% 9%;color:#2c1608;font:700 clamp(19px,4.5vmin,42px)/1.65 "Aref Ruqaa",serif;text-align:center}
#rot{display:none;position:fixed;inset:0;background:#120803;z-index:9;align-items:center;justify-content:center;text-align:center;font:400 28px Lalezar,serif;color:var(--gold);padding:1em}
@media (orientation:portrait){#rot{display:flex}}
[hidden]{display:none!important}
</style></head><body>
<canvas id="c" width="1672" height="941"></canvas>
<div id="ui">
<div id="hud" hidden><div id="tasks"></div><div id="stat"></div></div>
<button id="act" class="btn" hidden></button>
<div id="float" style="opacity:0"></div>

<div id="card" hidden></div>
<button id="skip" class="btn ghost" hidden>تخطّي</button>
<div id="letter" hidden><div></div></div>
<div id="dlg" hidden><img alt=""><div class="t"><b></b><span></span></div><i></i></div>
<div id="choices" hidden></div>

</div>
<div id="rot">لفّ جهازك بالعرض</div>
<script>
const ASSETS=/*ASSETS*/null,META=/*META*/null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const $=s=>document.querySelector(s),cv=$('#c'),X=cv.getContext('2d',{alpha:false});
const W=1672;let H=941;const KEY='awwal-barmeel-ep1';
const img={};
function loadAll(){return Promise.all(Object.keys(ASSETS).map(k=>new Promise(r=>{const i=new Image();i.onload=()=>{img[k]=i;r()};i.onerror=r;i.src=ASSETS[k]})))}
function setView(full){const want=full?Math.round(clamp(W*innerHeight/innerWidth,720,1260)):941;if(want!==H||cv.height!==want){H=want;cv.height=want}fit()}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
const refit=()=>setView(S.mode==='map');addEventListener('resize',refit);
const lateRefit=()=>{refit();for(const t of [80,250,500,900])setTimeout(refit,t)};addEventListener('orientationchange',lateRefit);if(window.visualViewport)visualViewport.addEventListener('resize',refit);document.addEventListener('visibilitychange',()=>{if(!document.hidden)lateRefit()});fit();
let save={ch:0,flags:{}};
const store={load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s.ch==='number')save=s}catch(e){}},put(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
const META_KEY='awwal-barmeel-meta';let meta={secrets:{},ach:{},music:70,sfx:80,quality:'high'};
try{meta=Object.assign(meta,JSON.parse(localStorage.getItem(META_KEY))||{})}catch(e){}
const putMeta=()=>{try{localStorage.setItem(META_KEY,JSON.stringify(meta))}catch(e){}};
const DEV_EMAIL='csscre4m@gmail.com';
const TEST=/[?&]test/.test(location.search);
const ease=t=>t*t*(3-2*t);
let time=0,skipping=false,skipOK=false;
/* ---------- tweens & waits ---------- */
let jobs=[];
function tween(ms,fn){return new Promise(res=>{if(skipping||ms<=0){fn(1);res();return}let t=0;jobs.push({u(dt){t+=dt*1000;const p=clamp(t/ms,0,1);fn(p);if(p>=1){res();return true}}})})}
const wait=ms=>tween(TEST?Math.min(ms,30):ms,()=>{});
/* ---------- stage ---------- */
const S={mode:'none',bg:null,bg2:null,bg2a:0,fade:1,bars:0,shake:0,tint:null,actors:[],parts:[],overlay:null,lamp:0,drops:0,oilT:0,dust:[]};
function actor(name,x,y,h=255,dir='s'){const a={name,x,y,h,dir,f:1,step:0,on:true,bob:0};S.actors.push(a);return a}
function drawWalker(c,a,ox=0,oy=0){const im=img['w_'+a.name],[cw,ch]=META['w_'+a.name+'_cell'];if(!im)return;
 const row={f:0,b:3,r:6,l:6}[a.dir]??0;const s=a.h/ch,dw=cw*s,dh=ch*s,x=a.x-ox,y=a.y-oy+(a.bob||0);
 c.fillStyle='rgba(40,14,0,.28)';c.beginPath();c.ellipse(x,a.y-oy,dw*.27,dh*.05,0,0,7);c.fill();
 const k=row+[0,1,2,1][a.step%4]*(a.moving?1:0)+(a.moving?0:1);
 c.save();c.translate(x,y);if(a.dir==='l')c.scale(-1,1);c.drawImage(im,k*cw,0,cw,ch,-dw/2,-dh,dw,dh);c.restore()}
function walk(a,x,y,speed=230){return new Promise(res=>{if(skipping){a.x=x;a.y=y;a.moving=false;a.dir='f';res();return}
 const dx=x-a.x,dy=y-a.y,d=Math.hypot(dx,dy);if(d<1){res();return}a.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'f':'b');a.moving=true;let go=0;const sp=TEST?speed*12:speed;
 jobs.push({u(dt){const st=sp*dt;go+=st;a.x+=dx/d*st;a.y+=dy/d*st;a.step=Math.floor(go/(a.h*.17));if(go>=d){a.x=x;a.y=y;a.moving=false;res();return true}}})})}
function cover(c,im){c.drawImage(im,0,0,W,H)}
function drawCine(){X.save();
 if(S.shake>0){X.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake)}
 if(S.bg)cover(X,S.bg);if(S.bg2&&S.bg2a>0){X.globalAlpha=S.bg2a;cover(X,S.bg2);X.globalAlpha=1}
 if(S.drops>0)drawDrops(false);
 for(const a of [...S.actors].filter(a=>a.on).sort((p,q)=>p.y-q.y))drawWalker(X,a);
 if(S.drops>0)drawDrops(true);
 drawDust();
 if(S.tint){X.fillStyle=S.tint;X.fillRect(0,0,W,H)}
 if(S.lamp>0){const g=X.createRadialGradient(1010,450,10,1010,450,430);g.addColorStop(0,`rgba(255,190,90,${.42*S.lamp})`);g.addColorStop(1,'rgba(255,190,90,0)');X.fillStyle=g;X.fillRect(0,0,W,H)}
 X.restore();
 if(S.bars>0){X.fillStyle='#000';const b=62*S.bars;X.fillRect(0,0,W,b);X.fillRect(0,H-b,W,b)}}
const oil=[];
function drawDrops(front){for(const d of oil){if((d.z>0)!==front)continue;X.fillStyle=d.c;X.fillRect(d.x|0,d.y|0,d.s,d.s*1.5)}}
function updDrops(dt){if(S.drops>0){for(let n=0;n<S.drops*dt*(meta.quality==='low'?.45:1);n++){oil.push({x:Math.random()*W,y:-20,v:360+Math.random()*420,s:3+Math.random()*7|0,z:Math.random()-.4,c:Math.random()<.2?'#6d3a14':'#1d0d05'})}}
 for(let i=oil.length-1;i>=0;i--){const d=oil[i];d.y+=d.v*dt;if(d.y>H)oil.splice(i,1)}}
function puff(x,y,n=8,c='rgba(235,190,120,.7)',up=80){for(let i=0;i<n;i++)S.dust.push({x:x+(Math.random()-.5)*30,y:y+(Math.random()-.5)*12,vx:(Math.random()-.5)*160,vy:-Math.random()*up,l:.5+Math.random()*.5,t:0,s:6+Math.random()*12|0,c})}
function drawDust(){for(const p of S.dust){X.globalAlpha=clamp(1-p.t/p.l,0,1);X.fillStyle=p.c;X.fillRect(p.x|0,p.y|0,p.s,p.s)}X.globalAlpha=1}
function updDust(dt){for(let i=S.dust.length-1;i>=0;i--){const p=S.dust[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.l)S.dust.splice(i,1)}}
const fadeTo=(a,ms=700)=>{const s=S.fade;return tween(TEST?10:ms,p=>S.fade=s+(a-s)*ease(p))};
const bars=(a,ms=500)=>{const s=S.bars;return tween(TEST?10:ms,p=>S.bars=s+(a-s)*ease(p))};
function setBg(n){S.bg=img['bg_'+n];S.bg2=null;S.bg2a=0}
/* ---------- dialogue ---------- */
const NAMES={salem:'سالم',young:'الخواجة',old:'الخواجة',hamdan:'حمدان',hero:'عبدالله',nasser:'ناصر',mubarak:'مبارك'};
let advance=null;
function say(who,mood,text){return new Promise(res=>{if(skipping){res();return}
 const d=$('#dlg'),im=d.querySelector('img'),nm=d.querySelector('b'),sp=d.querySelector('span'),ic=d.querySelector('i');
 if(who){im.src=ASSETS[`p_${who}_${mood}`]||'';im.hidden=false;nm.textContent=NAMES[who];nm.hidden=false}else{im.hidden=true;nm.hidden=true}
 d.hidden=false;ic.hidden=true;sp.textContent='';let n=0,done=false;const tick=setInterval(()=>{n+=2;sp.textContent=text.slice(0,n);if(n>=text.length){clearInterval(tick);done=true;ic.hidden=false}},TEST?1:32);
 advance=()=>{if(!done){clearInterval(tick);sp.textContent=text;done=true;ic.hidden=false;return}advance=null;d.hidden=true;res()};
 if(TEST)setTimeout(()=>{if(advance){advance();advance&&advance()}},5)})}
$('#dlg').addEventListener('pointerup',e=>{e.stopPropagation();advance&&advance()});
function choose(title,opts){return new Promise(res=>{skipping=false;$('#skip').hidden=true;const c=$('#choices');c.innerHTML=`<h3>${title}</h3>`;
 opts.forEach((o,i)=>{const b=document.createElement('button');b.className='btn';b.innerHTML=o.t+(o.s?`<small>${o.s}</small>`:'');b.onclick=()=>{c.hidden=true;res(i)};c.appendChild(b)});c.hidden=false;
 if(TEST){window.__choice=res;const k=window.__pick||0;setTimeout(()=>{c.hidden=true;res(k)},10)}})}
async function card(html,ms=2200){const c=$('#card');c.innerHTML=html;c.hidden=false;c.style.opacity=0;await tween(TEST?5:500,p=>c.style.opacity=p);await wait(ms);await tween(TEST?5:500,p=>c.style.opacity=1-p);c.hidden=true}
function toast(t){const f=$('#float');f.textContent=t;f.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>f.style.opacity=0,1700)}
function startScene(){S.actors=[];S.tint=null;S.lamp=0;S.drops=0;S.shake=0;oil.length=0;S.dust=[];skipping=false;$('#skip').hidden=!skipOK}
$('#skip').onclick=e=>{e.stopPropagation();skipping=true;if(advance){const a=advance;advance=null;$('#dlg').hidden=true;const sp=$('#dlg span');sp.textContent='';forceRes(a)}};
function forceRes(a){a();a()}
/* ---------- chapters ---------- */
async function ch0(){S.mode='cine';startScene();setBg('desert');S.fade=1;S.bars=1;
 const c=$('#card');await card('قبل ثلاثين سنة',1400);
 const s=actor('salem',-90,720);fadeTo(0,1100);await walk(s,560,720,190);s.dir='r';
 await say('salem','tired','ثلاثين يوم أحفر… والبير ناشف.');
 await say('salem','pain','هذي آخر نقطة مويه في القربة.');
 puff(760,720,10);S.shake=4;await wait(250);S.shake=0;
 await say('salem','hope','يا رب… ضربة وحدة بعد.');
 await walk(s,610,720,160);puff(700,715,14);S.shake=6;await wait(220);S.shake=0;await wait(600);
 await tween(TEST?5:900,p=>S.shake=p*7);
 await say('salem','shock','وش هذا؟ الأرض تتحرك!');
 await tween(TEST?5:1000,p=>S.shake=7+p*12);
 const w=$('#c');S.tint='rgba(255,255,255,.95)';await wait(90);S.bg=img.bg_gusher;S.tint=null;S.drops=170;s.x=330;s.y=745;s.dir='r';S.shake=14;
 await tween(TEST?5:1800,p=>S.shake=14-p*11);S.shake=2.5;
 await say('salem','joy','نفط! نفـــــط يا عالم!');
 await fadeTo(1,800);S.shake=0;await card('بعد أسبوعين',1100);S.drops=80;
 const y=actor('young',-90,770);await fadeTo(0,600);await walk(y,170,775,190);y.dir='r';s.dir='l';
 await say('young','smile','مستر سالم. عندك نفط، بس ما عندك مكينة.');
 await say('young','neutral','أنا أجيب المكينة والعمال. أنت تعطيني كل النفط. ثلاثين سنة، نفس السعر.');
 await say('salem','firm','بكم البرميل؟');
 await wait(600);
 await say('young','sly','بريال.');
 await wait(900);
 await say('salem','firm','وأول برميل يبقى لي. ما ينباع.');
 await say('young','laugh','Deal!\u200e');
 await fadeTo(1,1000);S.drops=0;$('#skip').hidden=true;
 await card('أول برميل',1800);
}
async function ch1(){S.mode='cine';startScene();setBg('site');S.bars=1;S.fade=1;await card('بعد ثلاثين سنة',1400);
 const h=actor('hero',1290,1000,290),m=actor('hamdan',1320,640,235);m.dir='f';m.on=false;
 fadeTo(0,1000);await walk(h,820,770,190);h.dir='r';m.on=true;await walk(m,1040,750,130);m.dir='l';
 await say('hamdan','neutral','تأخرت يا ولد سالم.');
 await say('hero','worried','جيت أول ما سمعت.');

 await say('hero','worried','وش هذا؟ فيه ورقة وراه.');await wait(400);
 const l=$('#letter');l.firstElementChild.style.backgroundImage=`url(${ASSETS.s_letter})`;const lines=['إذا قريت هذي، فأنا ما لحقت.','لا توقّع.','باقي على العقد ستة أشهر.'];const d=l.firstElementChild;d.textContent='';l.hidden=false;
 for(const t of lines){const p=document.createElement('div');p.style.cssText='position:static;width:auto;aspect-ratio:auto;padding:0;display:block';d.style.flexDirection='column';p.style.opacity=0;p.textContent=t;d.appendChild(p);await tween(TEST?5:900,q=>p.style.opacity=q);await wait(650)}
 await new Promise(r=>{if(TEST)return setTimeout(r,10);const f=()=>{l.removeEventListener('pointerup',f);r()};l.addEventListener('pointerup',f)});l.hidden=true;
 await say('hero','firm','ستة أشهر.');await fadeTo(1,1200)}
async function ch6(){S.mode='none';$('#skip').hidden=true;const dec=save.flags.decision;const c=$('#title');c.innerHTML=`<h1 style="font-size:clamp(40px,10vmin,90px)">نهاية الحلقة الأولى</h1><p>${dec===0?'اخترت الناس، وخسرت من الخزان.':''+(save.flags.mubarakAdvance?'اخترت الخزان، ومبارك صابر على مضض.':'اخترت الخزان، وخسرت مبارك.')+''}</p><p style="opacity:.8">الحلقة الجاية: الخواجة يعرف إنك ما بتبيع.</p><p>الأسرار: ${secretCount()}/${SECRETS.length}${meta.ach.ep1?' · إنجاز «اللي يدور يلقى»':' · فيه أسرار ما لقيتها بعد'}</p><button class="btn go" id="again">القائمة الرئيسية</button>`;c.style.backgroundImage='none';c.style.background='#000';c.style.justifyContent='center';c.hidden=false;S.fade=1;$('#again').onclick=()=>{store.clear();save={ch:0,flags:{}};location.reload()}}
const CH=[ch0,ch1,ch2,ch3,ch4,ch5,ch6];
async function intro(){S.mode='none';S.fade=1;await wait(350);await card('إنتاج<small style="font:400 1.6em Lalezar,serif;margin:.1em 0 0">شادي الصاعدي</small>',1500);await wait(250);await card('الحلقة الأولى<small style="font:400 1.9em Lalezar,serif;color:#f2b84b;margin:.1em 0 0">بريال</small>',1700);await wait(300)}
async function run(from){if(from===0)await intro();for(let i=from;i<CH.length;i++){save.ch=i;store.put();skipOK=(i===0||i===1||i===4)&&!TEST;$('#skip').hidden=true;await CH[i]();if(i===2&&save.ch===3){}save.ch=i+1;store.put()}}
function secretCount(){return SECRETS.filter(s=>meta.secrets[s.id]).length}
function panel(html){const p=$('#panel');p.firstElementChild.innerHTML=html+'<button class="btn ghost" id="pback" style="margin-top:.5em">رجوع</button>';p.hidden=false;$('#pback').onclick=()=>p.hidden=true}
function panelEpisodes(){panel(`<h2>الحلقات</h2>
 <div class="row"><div><b>الحلقة الأولى: بريال</b><small>متاحة · الأسرار ${secretCount()}/${SECRETS.length}${meta.ach.ep1?' · الإنجاز محقق':''}</small></div><button class="btn" id="ep1">العب</button></div>
 <div class="row off"><div><b>الحلقة الثانية</b><small>قريبًا</small></div></div>
 <div class="row off"><div><b>الحلقة الثالثة</b><small>قريبًا</small></div></div>`);$('#ep1').onclick=()=>{$('#panel').hidden=true;askNew()}}
function panelSettings(){panel(`<h2>الإعدادات</h2>
 <div class="row"><b>الموسيقى</b><input type="range" id="sm" min="0" max="100" value="${meta.music}"></div>
 <div class="row"><b>المؤثرات الصوتية</b><input type="range" id="se" min="0" max="100" value="${meta.sfx}"></div>
 <div class="note">الصوت يوصل في تحديث قريب، واختيارك هنا ينحفظ له.</div>
 <div class="row"><b>الجودة</b><div class="seg"><button id="qh" class="${meta.quality==='high'?'on':''}">عالية</button><button id="ql" class="${meta.quality==='low'?'on':''}">موفرة</button></div></div>`);
 $('#sm').oninput=e=>{meta.music=+e.target.value;putMeta()};$('#se').oninput=e=>{meta.sfx=+e.target.value;putMeta()};
 const q=v=>{meta.quality=v;putMeta();$('#qh').className=v==='high'?'on':'';$('#ql').className=v==='low'?'on':''};$('#qh').onclick=()=>q('high');$('#ql').onclick=()=>q('low')}
function panelContact(){panel(`<h2>تواصل معنا</h2><div class="note" style="opacity:1;font-size:1em">عندك فكرة أو لقيت مشكلة؟ راسلنا على:</div><p><a href="mailto:${DEV_EMAIL}?subject=${encodeURIComponent('أول برميل')}">${DEV_EMAIL}</a></p>`)}
function askNew(){if(save.ch>0){panel(`<h2>تبدأ من جديد؟</h2><div class="note" style="opacity:1;font-size:1em">تقدمك الحالي بينمسح. الأسرار والإنجازات تبقى لك.</div><button class="btn" id="yes">إيه، من البداية</button> `);$('#yes').onclick=()=>{$('#panel').hidden=true;startNew()}}else startNew()}
function startNew(){save={ch:0,flags:{}};store.clear();beginAt(0)}
function beginAt(n){const c=$('#title');c.style.opacity=0;setTimeout(()=>{c.hidden=true;c.style.opacity=1;run(n)},TEST?10:720)}
function titleScreen(){S.mode='none';S.fade=1;const c=$('#title');const has=save.ch>0;c.style.backgroundImage=`url(${ASSETS.bg_desert})`;
 c.innerHTML=`<h1>أول برميل</h1><nav class="menu">${has?'<button class="mi first" id="go2">استمرار</button>':''}<button class="mi ${has?'':'first'}" id="go">${has?'لعبة جديدة':'ابدأ'}</button><button class="mi" id="eps">الحلقات</button><button class="mi" id="set">الإعدادات</button><button class="mi" id="con">تواصل معنا</button></nav>`;c.hidden=false;
 $('#go').onclick=askNew;if(has)$('#go2').onclick=()=>beginAt(save.ch);$('#eps').onclick=panelEpisodes;$('#set').onclick=panelSettings;$('#con').onclick=panelContact}
/* ---------- loop ---------- */
let last=0;function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time+=dt;jobs=jobs.filter(j=>!j.u(dt));updDrops(dt);updDust(dt);
 if(S.mode==='map'){updMap(dt);drawMap()}else if(S.mode==='room'){updRoom(dt);drawRoom()}else if(S.mode==='pipes'){if(S.shake)S.shake=0;drawPipes()}else if(S.mode==='jack'){updJack(dt);S.shake=Math.max(0,S.shake-dt*30);drawJack()}else if(S.mode==='board'){updBoard(dt);drawBoard()}else if(S.mode==='cine')drawCine();else{X.fillStyle='#000';X.fillRect(0,0,W,H)}
 if(S.fade>0){X.fillStyle=`rgba(0,0,0,${S.fade})`;X.fillRect(0,0,W,H)}
 requestAnimationFrame(frame)}

document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());
Promise.all([loadAll(),Promise.race([document.fonts?Promise.all(['400 40px Lalezar','700 30px "Aref Ruqaa"','400 20px Almarai','700 20px Almarai','800 20px Almarai'].map(f=>document.fonts.load(f,'ابجد'))):0,new Promise(r=>setTimeout(r,3000))])]).then(()=>{store.load();requestAnimationFrame(frame);titleScreen();window.__ready=true});
if('serviceWorker'in navigator&&location.protocol==='https:'&&!location.hostname.includes('claude'))navigator.serviceWorker.register('sw.js').catch(()=>{});
