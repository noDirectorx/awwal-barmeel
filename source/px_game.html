<style>
/* Layout: one portrait screen. A pixel desert fills it; walnut-and-brass RPG panels float over it. */
:root{
  color-scheme:dark;
  --ink:#1c120c;--wood:#2e1e14;--wood2:#3f2a1b;--wood3:#5a3d26;--brass:#c8923e;--gold:#ffd873;--sand:#f7e3bd;--muted:#c4ab8c;--good:#9be08f;--bad:#ff9a84;--alarm:#c62f2f;
  --display:"Lalezar","Almarai",system-ui,sans-serif;--body:"Almarai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none}
body{color:var(--sand);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;background:#d9a860}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
button,.panel,.item{box-sizing:border-box}.panel{border:14px solid transparent}
#top{position:absolute;inset:0 0 auto;display:grid;gap:7px;padding-top:max(9px,env(safe-area-inset-top,0px));padding-left:max(9px,env(safe-area-inset-left,0px));padding-right:max(9px,env(safe-area-inset-right,0px));pointer-events:none}
#hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));row-gap:3px;padding:0}
.budget{grid-column:1/-1;display:flex;align-items:center;gap:6px;justify-content:center;font-size:12.5px;color:var(--muted);border-top:2px solid var(--wood3);padding-top:4px}.budget img{width:20px;height:20px}.budget b{color:var(--gold);font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}.budget b.neg{color:var(--bad)}
.chip{text-align:center;min-width:0}.chip small{display:block;font-size:10px;color:var(--muted);line-height:1.1}#gc{float:left;font-family:var(--body);font-size:13px;font-weight:800;color:var(--sand)}
.chip img{width:24px;height:24px;display:block;margin:0 auto 1px}
.chip b{display:block;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;overflow:hidden}
#mission{padding:0 2px;display:grid;gap:1px}
#mission b{font-family:var(--display);font-weight:400;font-size:18.5px;line-height:1.25;color:var(--gold)}
#mission span{font-size:12px;color:var(--muted);line-height:1.5}
#goal{height:14px;box-sizing:border-box;border:5px solid transparent;margin-top:3px;background:var(--ink);background-clip:padding-box}#goal i{display:block;height:100%;width:0}
#alarm{background:var(--alarm);color:#fff;box-shadow:0 0 0 2px var(--ink);padding:8px 11px;font-weight:800;font-size:13px;line-height:1.5;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.75}}
#toast{position:absolute;inset-inline:16px;bottom:calc(196px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none}
#toast span{display:inline-block;padding:0 4px;font-size:13px;font-weight:700;line-height:1.5}
#ctx{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));inset-inline:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:none;padding-inline:16px}
#ctx button{pointer-events:auto}
.primary{color:#2a1806;font-weight:800;padding:1px 10px;min-height:50px;font-size:15px;border:11px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.primary[disabled]{color:#e8e0d4;cursor:default}
.ghost{color:var(--sand);font-weight:700;padding:0 6px;min-height:44px;font-size:13.5px;border:11px solid transparent}
.ghost[disabled]{opacity:.62;cursor:default}
.danger{color:#fff;font-weight:800;padding:0 8px;min-height:46px;font-size:14px;border:11px solid transparent}
.bi{width:22px;height:22px;flex:none}
/* cinematic */
.bar{position:absolute;inset-inline:0;height:0;background:#000;transition:height .7s;z-index:3;pointer-events:none}#barT{top:0}#barB{bottom:0}
.cine .bar{height:11%}
#caption{position:absolute;inset:auto 0 13%;padding-inline:24px;text-align:center;z-index:4;font-family:var(--display);font-size:25px;line-height:1.4;color:var(--sand);text-shadow:0 2px 0 #000,0 0 12px #000;pointer-events:none;text-wrap:balance}
#snd{position:absolute;z-index:8;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:42px;height:42px;background:rgba(28,18,12,.72);box-shadow:0 0 0 2px var(--brass);color:var(--gold);font-size:12px;font-weight:800;padding:0}
#zb{position:absolute;z-index:8;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}#zb button{width:42px;height:36px;background:rgba(28,18,12,.72);box-shadow:0 0 0 2px var(--brass);color:var(--gold);font-size:22px;font-weight:800;padding:0;line-height:1}
#banner{position:absolute;left:0;right:0;top:34%;z-index:6;text-align:center;pointer-events:none;font-family:var(--display);font-size:clamp(24px,min(7vw,10vh),44px);color:var(--gold);text-shadow:0 3px 0 #6b3d10,0 6px 0 #000,0 0 22px rgba(255,216,115,.6);padding-inline:16px;animation:slam .45s cubic-bezier(.2,1.5,.4,1)}
#skip{position:absolute;z-index:8;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-start:max(10px,env(safe-area-inset-right,0px));background:rgba(0,0,0,.55);padding:8px 12px;font-size:12.5px;min-height:36px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
#titlecard{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
#titlecard h1{font-family:var(--display);font-weight:400;font-size:clamp(62px,21vw,104px);margin:0;white-space:nowrap;color:var(--gold);text-shadow:0 5px 0 #6b3d10,0 9px 0 #000;animation:slam .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes slam{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
#dlg{position:absolute;inset:auto 10px calc(12px + env(safe-area-inset-bottom,0px));z-index:9;padding:2px;display:grid;gap:8px}
#dlg .row{display:flex;gap:12px;align-items:flex-end}
#dlg .por{width:88px;height:88px;flex:none;image-rendering:pixelated;object-fit:contain;object-position:bottom;background:#1c120c;box-shadow:0 0 0 2px var(--brass),0 0 0 4px #5a3d26}
#dlg .tx{min-width:0;flex:1;display:grid;gap:5px}
#dlg .who{font-family:var(--display);color:var(--gold);font-size:19px;line-height:1.1}
#dlg p{margin:0;font-size:15.5px;line-height:1.65;font-weight:700}
#dlg .btns{display:flex;gap:8px;flex-wrap:wrap}#dlg .btns button{flex:1 1 120px}
#close{position:absolute;inset:0;background:#000;z-index:9;display:grid;place-items:center;overflow:hidden;transition:opacity .9s}
#close .wrap{position:relative;width:min(118vw,620px);animation:push 5s ease-out forwards}
#close img{width:100%;display:block;image-rendering:pixelated}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.16)}}
#close i{position:absolute;width:1.6%;aspect-ratio:1;background:#ffe9a0;opacity:0;animation:glint 1.3s 1.7s steps(4) 2}
@keyframes glint{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.5)}}
#close p{position:absolute;inset:auto 0 9%;margin:0;text-align:center;padding-inline:22px;font-family:var(--display);font-size:27px;line-height:1.35;color:var(--gold);text-shadow:0 3px 0 #000;text-wrap:balance}
/* sheets */
#scrim{position:absolute;inset:0;background:rgba(14,8,4,.55);display:flex;align-items:flex-end;z-index:9}
#frame{position:relative;width:100%;max-height:84%;display:flex;box-sizing:border-box;border:36px solid transparent;border-bottom-width:26px;padding-bottom:env(safe-area-inset-bottom,0px)}
#crown{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:96px;image-rendering:pixelated;pointer-events:none}
#sheet{flex:1;min-width:0;overflow:auto;display:grid;gap:7px;touch-action:pan-y;padding:2px 2px 4px;margin-top:22px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h2{font-family:var(--display);font-weight:400;font-size:25px;margin:0;line-height:1.1;color:var(--gold)}
#x{width:44px;height:44px;flex:none;background-size:100% 100%;image-rendering:pixelated}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.tabs button{min-height:58px;font-size:11.5px;font-weight:800;border:9px solid transparent;padding:0;color:var(--sand);display:grid;justify-items:center;align-content:center;gap:1px}
.tabs button img{width:20px;height:20px}
.tabs button[aria-pressed="true"]{color:#2a1806}
.item{padding:2px 5px;display:grid;gap:6px;border:12px solid transparent}
.item h3{margin:0;font-size:14.5px;font-weight:800;line-height:1.4;display:flex;align-items:center;gap:8px}
.item h3 img{width:36px;height:36px;flex:none;object-fit:contain}.item h3 img.pxl{image-rendering:pixelated}
.item p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.radar{position:relative;width:min(100%,250px);aspect-ratio:1;margin:0 auto;background-size:100% 100%;image-rendering:pixelated;overflow:hidden;border-radius:50%}
.radar i{position:absolute;inset:3%;border-radius:50%;background:conic-gradient(rgba(127,240,150,.5),transparent 28%);animation:sweep 3s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.radar b{position:absolute;width:9px;height:9px;margin:-4px;background:#ff4a3a;box-shadow:0 0 6px #ff4a3a}
.radar u{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3px;background:var(--gold)}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.job{display:flex;align-items:center;gap:8px;font-size:13px}.job select{flex:1;min-height:40px;background:var(--wood3);color:var(--sand);border:0;padding:0 8px;font:inherit;font-weight:700}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.ok{color:var(--good);font-weight:800;font-size:12.5px}.bad{color:var(--bad);font-weight:800;font-size:12.5px}
@media (orientation:landscape){
  #top{gap:5px;padding-top:max(5px,env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  #hud.panel{display:flex;align-items:center;justify-content:space-between;gap:6px;border-width:7px;border-image-width:7px;padding:0 8px}
  .chip{display:flex;align-items:center;gap:5px}.chip img{width:20px;height:20px;margin:0}.chip b{font-size:13.5px}.chip small{display:none}
  .budget{border:0;padding:0;font-size:12px;order:-1;margin-inline-end:14px}.budget span{display:none}.budget b{font-size:15px}
  #mission.panel{justify-self:start;width:min(32vw,250px);padding:0;border-width:9px;border-image-width:9px}#mission b{font-size:14px}#mission span{font-size:10.5px;line-height:1.35}#goal{height:12px}#gc{font-size:11.5px}
  #alarm{justify-self:start;width:min(32vw,250px);box-sizing:border-box;font-size:11px;padding:5px 8px}
  #toast{inset-inline:auto;top:50px;bottom:auto;left:max(12px,env(safe-area-inset-left,0px));text-align:left;width:min(40vw,330px)}
  #toast span{font-size:12.5px;padding:7px 12px}
  #ctx{bottom:max(12px,env(safe-area-inset-bottom,0px))}
  .primary{min-height:44px;font-size:14px}.panel{border-width:10px}
  #scrim{align-items:stretch;justify-content:flex-start}
  #frame{width:min(60vw,500px);max-height:none;height:100%;border-width:28px 28px 20px}#crown{display:none}#sheet{margin-top:0}.tabs button{min-height:50px}
  .cine .bar{height:9%}
  #caption{bottom:12%;font-size:22px}
  #skip{top:calc(4px + env(safe-area-inset-top,0px))}
  #titlecard h1{font-size:clamp(56px,24vh,104px)}
  #dlg{inset:auto auto max(8px,env(safe-area-inset-bottom,0px)) 50%;transform:translateX(-50%);width:min(72vw,620px);padding:0;gap:6px}
  #dlg .por{width:64px;height:64px}#dlg p{font-size:14px;line-height:1.5}#dlg .who{font-size:16px}
  #close .wrap{width:min(92vh,70vw)}
  #close p{font-size:22px;inset:auto 0 5%}
}
#splash{position:absolute;inset:0;z-index:20;background:#140c08;display:grid;place-items:center;transition:opacity .35s;text-align:center;padding:16px}
#sp1,#sp2{display:grid;justify-items:center;gap:10px;animation:spIn .8s ease-out both}
#spLogo{width:min(52vw,40vh,220px);image-rendering:pixelated;animation:spGlow 1s 1s ease-in-out}
#splash h1,#menu h1{font-family:var(--display);font-weight:400;margin:0;color:var(--gold);font-size:clamp(38px,11vw,60px);line-height:1.1;text-shadow:0 3px 0 #6b3d10}
#spBar{width:min(56vw,220px);height:6px;background:#3a2418;box-shadow:0 0 0 2px #6b4a24}#spBar i{display:block;height:100%;background:var(--gold);animation:spFill 2.7s linear both}
#sp2 span{color:var(--muted);font-size:15px}#sp2 b{font-family:var(--display);font-weight:400;color:var(--sand);font-size:clamp(32px,9vw,46px);line-height:1.2}
@keyframes spIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes spGlow{50%{filter:brightness(1.45)}}
@keyframes spFill{from{width:0}to{width:100%}}
#menu{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,12,8,.55);padding:16px;text-align:center}
#pick{position:absolute;inset:0;z-index:7;background:rgba(20,12,8,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}#pick h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,42px);color:var(--gold);margin:0}.prow{display:flex;gap:12px;justify-content:center;width:100%}.prow{align-items:stretch}.pcard{align-content:space-between;flex:0 1 min(44vw,58vh,230px);min-width:0;border:12px solid transparent;display:grid;gap:6px;justify-items:center;padding:0;background:#1c120c;background-clip:padding-box}.pcard img{width:100%;image-rendering:pixelated}.pcard b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--sand)}.pcard:active{filter:brightness(1.25)}
#mLogo{width:min(50vw,34vh,200px);image-rendering:pixelated}
.mcol .primary{font-size:18px;min-height:58px}.mcol{display:grid;gap:10px;justify-items:center;width:min(78vw,300px)}.mcol button{width:100%}
@media (min-width:700px) and (min-height:600px){#top,#ctx,#dlg,#toast,#frame,#sp1,#sp2,#mLogo,.mcol,#snd,#pick>*,#zb{zoom:1.5}}
@media (prefers-reduced-motion:reduce){#sp1,#sp2,#spLogo{animation:none}}
@media (orientation:landscape){#menu{flex-direction:row;gap:32px}#mLogo{width:auto;height:min(68vh,240px)}#spLogo{width:auto;height:44vh}#splash h1{font-size:34px}#menu h1{font-size:44px}}
</style>

<div id="app" dir="rtl" lang="ar">
  <canvas id="c" aria-label="اسحب بإصبعك في أي مكان عشان تمشي"></canvas>
  <div id="top" hidden><div id="hud" class="panel"></div><div id="alarm" hidden></div><div id="mission" class="panel"></div></div>
  <div id="toast" hidden><span class="panel"></span></div>
  <div id="ctx"></div>
  <div class="bar" id="barT"></div><div class="bar" id="barB"></div>
  <div id="caption" hidden></div>
  <div id="flash"></div>
  <div id="titlecard" hidden><h1>أول برميل</h1></div>
  <button id="skip" hidden>تخطّي</button>
  <button id="snd" aria-label="الصوت"></button>
  <div id="zb" hidden><button id="zi" aria-label="تقريب">+</button><button id="zo" aria-label="تبعيد">−</button></div>
  <div id="banner" hidden></div>
  <div id="dlg" class="panel" hidden></div>

</div>

<script>
(function(){
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const KEY='awwal-barmeel-v5';
const ART=/*ASSETS*/null;
const nineCSS=(sel,k,n,w)=>sel+'{border-image:url('+ART[k]+') '+n+' fill / '+(w||n*1.0)+'px stretch;image-rendering:pixelated}';
(function(){const st=document.createElement('style');st.textContent=[nineCSS('.panel','ui_panel',22,14),nineCSS('.primary','ui_gold',15,11),nineCSS('.primary:active:not([disabled])','ui_pressed',15,11),nineCSS('.primary[disabled]','ui_gray',15,11),nineCSS('.ghost','ui_wood',15,11),nineCSS('.ghost[disabled]','ui_gray',15,11),nineCSS('.danger','ui_red',15,11),nineCSS('.tabs button','ui_wood',15,9),nineCSS('.tabs button[aria-pressed="true"]','ui_gold',15,9),'#frame{border-image:url('+ART.ui_frame+') 38 / 36px stretch;image-rendering:pixelated;background:#2a1209;background-clip:padding-box}',nineCSS('.item','ui_row',12,12),nineCSS('.pcard','ui_row',12,12),nineCSS('#goal','ui_barframe',8,5),'#goal i{background:url('+ART.ui_fill+') 0 0/100% 100%;image-rendering:pixelated}','#x{background-image:url('+ART.ui_x+')}','.radar{background-image:url('+ART.ui_radar+')}'].join('');document.body.appendChild(st);document.getElementById('crown').src=ART.ui_crown})();
const ic=(n,c)=>'<img alt="" class="'+(c||'')+'" src="'+ART['i_'+n]+'">';
const IMG={};Object.keys(ART).forEach(k=>{const i=new Image();i.src=ART[k];IMG[k]=i});
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const fmt2=n=>(Math.round(n*10)/10).toLocaleString('en-US');
const short=n=>n<10000?fmt(n):new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(n);
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const NAMES={wood:'خشب',stone:'حجر',money:'ريال'};
const JOBS={wood:'يكسر شجر',stone:'يكسر صخور',plant:'يزرع',haul:'يعبي وينقل',sell:'يبيع',eng:'مهندس مضخة',sec:'رجل أمن',fire:'رجل إطفاء',radar:'مشغّل اعتراض'};
const COMPANIES=['قهوة رمال الفجر','تمور واحة سدرة','مجموعة نجم البادية','عطور ريم الصحراء','شركة جسر الأفق','مصانع مرجان الرمل','بن الجبل الأسود','شاي قافلة الذهب','مطاحن سنبلة الوادي','حلويات ليالي النخيل'];

  if(joy){const m=Math.hypot(joy.dx,joy.dy);if(m>7){const k=Math.min(1,m/42);dx=joy.dx/m*k;dy=joy.dy/m*k}}
  if(keys.ArrowLeft||keys.KeyA)dx=-1;if(keys.ArrowRight||keys.KeyD)dx=1;if(keys.ArrowUp||keys.KeyW)dy=-1;if(keys.ArrowDown||keys.KeyS)dy=1;if(dx&&dy&&!joy){dx*=.71;dy*=.71}
  const sp=S.rideF?195+14*lv('forklift'):135;moving=!!(dx||dy);
  if(moving){const nx=Math.max(MAP.x0+20,Math.min(MAP.x1-20,S.px+dx*sp*dt)),ny=Math.max(MAP.y0+20,Math.min(MAP.y1-20,S.py+dy*sp*dt));
    if(wallOK(S.px,S.py,nx,ny)){S.px=nx;S.py=ny}else if(wallOK(S.px,S.py,nx,S.py))S.px=nx;else if(wallOK(S.px,S.py,S.px,ny))S.py=ny;else if(time-(move.w||-9)>8){move.w=time;toast('اطلع من البوابة اللي تحت.')}
    const q=dirOf(dx,dy);pdir=q[0];pflip=q[1];const w0=Math.floor(walkT/2);walkT+=dt*10;if(Math.floor(walkT/2)!==w0&&!S.rideF)SND.play('step')}else walkT=0;collide();
}

  S.played+=dt;actT+=dt;payT+=dt;swing=Math.max(0,swing-dt*4);const tick=actT>.22;if(tick)actT=0;const payTick=payT>.07;if(payTick)payT=0;

    if(t.st==='s'&&d<26&&has('nursery')&&S.water>=1&&tick){S.water--;t.st='g';t.t=28*(1-.25*lv('nursery'));S.planted++;float(t.x,t.y-20,'زرعت شجرة','#b5e8bd')}
  });
  S.rocks.forEach(r=>{if(r.hp>0&&dist(r.x,r.y,S.px,S.py)<38&&tick&&!S.rideF){if(!S.hammer)return;r.hp--;S.stone+=3;fly('stone',r.x,r.y-20,3);swing=1;SND.play('stone');burst(r.x,r.y-8,5,'#a79aa8',46);float(r.x,r.y-34,'+3 حجر');if(r.hp<=0)r.t=45}if(r.hp<=0){r.t-=dt;if(r.t<=0)r.hp=4}});

  ambience(dt);monthly(dt);investors(dt);threat(dt);
}

function closeUp(){SND.play('laugh');const c=$('close');c.hidden=false;c.style.opacity='1';c.innerHTML='<div class="wrap"><img alt="" src="'+ART['p_'+S.hero]+'"><i style="right:'+(S.hero==='munira'?46:58)+'%;top:30%"></i><i style="right:'+(S.hero==='munira'?33:36)+'%;top:'+(S.hero==='munira'?30:32)+'%"></i></div><p>'+(S.price===1?'ريال لكل برميل؟':'ريالين لكل برميل؟')+'<br>الحين صرنا أغنياء.</p>';
  setTimeout(()=>{c.style.opacity='0';setTimeout(()=>{c.hidden=true;c.innerHTML='';startPlay()},900)},4200)}
const HP={x:0,y:0,dir:'s',flip:false,walk:0,moving:false};
function stepHelper(dt){if(!S.helper)return;const d=dist(HP.x,HP.y,S.px,S.py);if(d>64){const sp=Math.min(S.rideF?195:135,d*1.6),dx=(S.px-HP.x)/d,dy=(S.py-HP.y)/d;HP.x+=dx*sp*dt;HP.y+=dy*sp*dt;const q=dirOf(dx,dy);HP.dir=q[0];HP.flip=q[1];HP.moving=true;HP.walk+=dt*8}else HP.moving=false}
function meetHelper(after){HP.x=S.px+46;HP.y=S.py+18;HP.dir='e';HP.flip=true;S.helper=1;const por='p_hamdan';
  say('حمدان',por,'السلام عليكم يا طويل العمر. شفت صفقتك مع الخواجة، وأعرف هالأرض شبر شبر. تبيني أساعدك؟',[{l:'إي أكيد',f(){
    say('حمدان',por,S.built.derrick?'الله يبارك فيك. أنا معك من اليوم، وبقول لك كل خطوة وش بعدها.':'أجل أول شي اكسر الخشب من هالشجر، وابن برج يحتوي هالكنز. لا تخليه يروح هدر في الأرض.',[{l:'يلا نبدأ',f(){$('dlg').hidden=true;save();if(after)after()}}])}}])}
function welcomeBack(){const t=Math.min(8*3600,(Date.now()-(S.seen||Date.now()))/1000)*.5;if(t<30||!cap())return;const rate=pumpRate()+branchRate()+pipeRate()+wellRate(),sr=fleetRate()+(has('dock')&&S.sold>=10?.8:0),prod=rate*t,sold=Math.min(prod+S.stored,sr*t);const before=S.money;if(sold>0)sell(sold);S.stored=Math.min(cap(),Math.max(0,S.stored+prod-sold));const wd=S.staff.filter(x=>x.role==='wood'&&!x.away).length*t*.5,st=S.hammer?S.staff.filter(x=>x.role==='stone'&&!x.away).length*t*.4:0;S.wood+=Math.floor(wd);S.stone+=Math.floor(st);if(prod<1&&wd<1&&st<1)return;const got=S.money-before,mins=Math.round(t/30);say('حمدان','p_hamdan','الحمد لله على السلامة. وأنت غايب '+fmt(mins)+' دقيقة: أنتجنا '+short(prod)+' برميل، ودخل الشركة '+short(got)+' ريال'+(wd>=1?'، وجمعنا '+short(wd)+' خشبة':'')+'.',[{l:'استلم',f(){$('dlg').hidden=true;SND.play('bigcoin');save()}}])}
function startPlay(){cineAlive=false;$('caption').hidden=true;$('flash').style.opacity='0';S.scene='play';cam.manual=false;cineFx.gush=0;parts=[];A.show=K.show=Jp.show=N.show=false;$('app').classList.remove('cine');cap_('');['dlg','skip','titlecard'].forEach(i=>$(i).hidden=true);$('top').hidden=false;S.px=WELL.x+30;S.py=WELL.y-48;cam.x=S.px;cam.y=S.py;cam.z=baseZ;save();meetHelper(()=>toast('اسحب إصبعك في أي مكان عشان تمشي، أو استخدم WASD.'))}
$('skip').addEventListener('click',()=>{cineAlive=false;S.price=1;S.startPrice=1;startPlay()});

/* ---------- Loop ---------- */
function frame(now){lastDt=Math.min(.05,(now-last)/1000)||1/60;const ar=$('app');if(Math.abs(ar.clientWidth-W)>1||Math.abs(ar.clientHeight-H)>1)resize();const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  if(!booting&&S.scene==='play'&&$('dlg').hidden){move(dt);sim(dt)}
  render(dt);
  if(!booting&&S.scene==='play'){uiT+=dt;if(uiT>.12){uiT=0;hud();liveSheet()}saveT+=dt;if(saveT>4){saveT=0;save()}}
  requestAnimationFrame(frame)}
syncFork();resize();
cam.x=S.px;cam.y=S.py;cam.z=baseZ;
let booting=true;
(function boot(){
  $('pA').src=ART.p_abdullah;$('pM').src=ART.p_munira;document.querySelectorAll('.pcard').forEach(b=>b.addEventListener('click',()=>{S.hero=b.dataset.hero;SND.play('up');$('pick').hidden=true;booting=false;save();cinematic()}));$('spLogo').src=ART.ui_logo;$('mLogo').src=ART.ui_logo;
  const has_=S.scene==='play';let seen=false;try{seen=localStorage.getItem('awwal-seen')==='1'}catch(e){}
  const sp=$('splash');let step=0,t1=null;
  const toMenu=()=>{if(step>=2)return;step=2;clearTimeout(t1);sp.style.opacity='0';setTimeout(()=>{sp.hidden=true},360);try{localStorage.setItem('awwal-seen','1')}catch(e){}
    $('menu').hidden=false;$('mStart').textContent=has_?'كمّل اللعب':'ابدأ القصة';$('mNew').hidden=!has_};
  const toStudio=()=>{if(step>=1)return;step=1;$('sp1').hidden=true;$('sp2').hidden=false;t1=setTimeout(toMenu,1500)};
  t1=setTimeout(toStudio,3000);
  if(seen)sp.addEventListener('pointerdown',toMenu);
  $('mStart').addEventListener('click',()=>{SND.unlock();setTimeout(()=>SND.play('up'),120);$('menu').hidden=true;booting=false;if(has_){$('top').hidden=false;cam.manual=false;if(S.helper){HP.x=S.px+46;HP.y=S.py+18;welcomeBack()}else meetHelper()}else{booting=true;$('pick').hidden=false}});
  let conf=false;$('mNew').addEventListener('click',()=>{if(!conf){conf=true;$('mNew').textContent='متأكد؟ اضغط مرة ثانية لحذف تقدمك';return}wiped=true;try{localStorage.removeItem(KEY)}catch(e){}location.reload()});
})();
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
requestAnimationFrame(frame);
})();
