<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">

<body>
<title>أول برميل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Lalezar&display=swap">
<style>
/* Layout: one portrait screen. A pixel desert fills it; walnut-and-brass RPG panels float over it. */
:root{
  color-scheme:dark;
  --ink:#1c120c;--wood:#2e1e14;--wood2:#3f2a1b;--wood3:#5a3d26;--brass:#c8923e;--gold:#ffd873;--sand:#f7e3bd;--muted:#c4ab8c;--good:#9be08f;--bad:#ff9a84;--alarm:#c62f2f;
  --display:"Lalezar","Almarai",system-ui,sans-serif;--body:"Almarai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none}
body{color:var(--sand);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin-inline:auto;overflow:hidden;background:#d9a860}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
button,.panel,.item{box-sizing:border-box}.panel{border:14px solid transparent}
#top{position:absolute;inset:0 0 auto;display:grid;gap:7px;padding-top:max(9px,env(safe-area-inset-top,0px));padding-left:max(9px,env(safe-area-inset-left,0px));padding-right:max(9px,env(safe-area-inset-right,0px));pointer-events:none}
#hud{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));row-gap:3px;padding:0}
.budget{grid-column:1/-1;display:flex;align-items:center;gap:6px;justify-content:center;font-size:12.5px;color:var(--muted);border-top:2px solid var(--wood3);padding-top:4px}.budget img{width:20px;height:20px}.budget b{color:var(--gold);font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}.budget b.neg{color:var(--bad)}
.chip{text-align:center;min-width:0}.chip small{display:block;font-size:10px;color:var(--muted);line-height:1.1}#gc{float:left;font-family:var(--body);font-size:13px;font-weight:800;color:var(--sand)}
.chip img{width:24px;height:24px;display:block;margin:0 auto 1px}
.chip b{display:block;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;overflow:hidden}
#mission{padding:0 2px;display:grid;gap:1px}
#mission b{font-family:var(--display);font-weight:400;font-size:18.5px;line-height:1.25;color:var(--gold)}
#mission span{font-size:12px;color:var(--muted);line-height:1.5}
#goal{height:14px;box-sizing:border-box;border:5px solid transparent;margin-top:3px;background:var(--ink);background-clip:padding-box}#goal i{display:block;height:100%;width:0}
#alarm{background:var(--alarm);color:#fff;box-shadow:0 0 0 2px var(--ink);padding:8px 11px;font-weight:800;font-size:13px;line-height:1.5;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.75}}
#toast{position:absolute;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none}
#toast span{display:inline-block;padding:0 4px;font-size:13px;font-weight:700;line-height:1.5}
#ctx{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));inset-inline:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:none;padding-inline:16px}
#ctx button{pointer-events:auto}
.primary{color:#2a1806;font-weight:800;padding:1px 10px;min-height:50px;font-size:15px;border:11px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.primary[disabled]{color:#e8e0d4;cursor:default}
.ghost{color:var(--sand);font-weight:700;padding:0 6px;min-height:44px;font-size:13.5px;border:11px solid transparent}
.ghost[disabled]{opacity:.62;cursor:default}
.danger{color:#fff;font-weight:800;padding:0 8px;min-height:46px;font-size:14px;border:11px solid transparent}
.bi{width:22px;height:22px;flex:none}
/* cinematic */
.bar{position:absolute;inset-inline:0;height:0;background:#000;transition:height .7s;z-index:3;pointer-events:none}#barT{top:0}#barB{bottom:0}
.cine .bar{height:11%}
#caption{position:absolute;inset:auto 0 13%;padding-inline:24px;text-align:center;z-index:4;font-family:var(--display);font-size:25px;line-height:1.4;color:var(--sand);text-shadow:0 2px 0 #000,0 0 12px #000;pointer-events:none;text-wrap:balance}
#skip{position:absolute;z-index:8;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-start:max(10px,env(safe-area-inset-right,0px));background:rgba(0,0,0,.55);padding:8px 12px;font-size:12.5px;min-height:36px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
#titlecard{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
#titlecard h1{font-family:var(--display);font-weight:400;font-size:clamp(62px,21vw,104px);margin:0;white-space:nowrap;color:var(--gold);text-shadow:0 5px 0 #6b3d10,0 9px 0 #000;animation:slam .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes slam{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
#dlg{position:absolute;inset:auto 10px calc(12px + env(safe-area-inset-bottom,0px));z-index:7;padding:2px;display:grid;gap:8px}
#dlg .row{display:flex;gap:12px;align-items:flex-end}
#dlg .por{width:88px;height:88px;flex:none;image-rendering:pixelated;object-fit:contain;object-position:bottom;background:#1c120c;box-shadow:0 0 0 2px var(--brass),0 0 0 4px #5a3d26}
#dlg .tx{min-width:0;flex:1;display:grid;gap:5px}
#dlg .who{font-family:var(--display);color:var(--gold);font-size:19px;line-height:1.1}
#dlg p{margin:0;font-size:15.5px;line-height:1.65;font-weight:700}
#dlg .btns{display:flex;gap:8px;flex-wrap:wrap}#dlg .btns button{flex:1 1 120px}
#close{position:absolute;inset:0;background:#000;z-index:9;display:grid;place-items:center;overflow:hidden;transition:opacity .9s}
#close .wrap{position:relative;width:min(118vw,620px);animation:push 5s ease-out forwards}
#close img{width:100%;display:block;image-rendering:pixelated}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.16)}}
#close i{position:absolute;width:1.6%;aspect-ratio:1;background:#ffe9a0;opacity:0;animation:glint 1.3s 1.7s steps(4) 2}
@keyframes glint{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.5)}}
#close p{position:absolute;inset:auto 0 9%;margin:0;text-align:center;padding-inline:22px;font-family:var(--display);font-size:27px;line-height:1.35;color:var(--gold);text-shadow:0 3px 0 #000;text-wrap:balance}
/* sheets */
#scrim{position:absolute;inset:0;background:rgba(14,8,4,.55);display:flex;align-items:flex-end;z-index:5}
#frame{position:relative;width:100%;max-height:84%;display:flex;box-sizing:border-box;border:36px solid transparent;border-bottom-width:26px;padding-bottom:env(safe-area-inset-bottom,0px)}
#crown{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:96px;image-rendering:pixelated;pointer-events:none}
#sheet{flex:1;min-width:0;overflow:auto;display:grid;gap:7px;touch-action:pan-y;padding:2px 2px 4px;margin-top:22px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h2{font-family:var(--display);font-weight:400;font-size:25px;margin:0;line-height:1.1;color:var(--gold)}
#x{width:44px;height:44px;flex:none;background-size:100% 100%;image-rendering:pixelated}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.tabs button{min-height:58px;font-size:11.5px;font-weight:800;border:9px solid transparent;padding:0;color:var(--sand);display:grid;justify-items:center;align-content:center;gap:1px}
.tabs button img{width:20px;height:20px}
.tabs button[aria-pressed="true"]{color:#2a1806}
.item{padding:2px 5px;display:grid;gap:6px;border:12px solid transparent}
.item h3{margin:0;font-size:14.5px;font-weight:800;line-height:1.4;display:flex;align-items:center;gap:8px}
.item h3 img{width:36px;height:36px;flex:none;object-fit:contain}.item h3 img.pxl{image-rendering:pixelated}
.item p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.radar{position:relative;width:min(100%,250px);aspect-ratio:1;margin:0 auto;background-size:100% 100%;image-rendering:pixelated;overflow:hidden;border-radius:50%}
.radar i{position:absolute;inset:3%;border-radius:50%;background:conic-gradient(rgba(127,240,150,.5),transparent 28%);animation:sweep 3s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.radar b{position:absolute;width:9px;height:9px;margin:-4px;background:#ff4a3a;box-shadow:0 0 6px #ff4a3a}
.radar u{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3px;background:var(--gold)}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.job{display:flex;align-items:center;gap:8px;font-size:13px}.job select{flex:1;min-height:40px;background:var(--wood3);color:var(--sand);border:0;padding:0 8px;font:inherit;font-weight:700}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.ok{color:var(--good);font-weight:800;font-size:12.5px}.bad{color:var(--bad);font-weight:800;font-size:12.5px}
@media (orientation:landscape) and (max-height:600px){
  #app{max-width:none}
  #top{gap:5px;padding-top:max(5px,env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  #hud.panel{display:flex;align-items:center;justify-content:space-between;gap:6px;border-width:7px;border-image-width:7px;padding:0 8px}
  .chip{display:flex;align-items:center;gap:5px}.chip img{width:20px;height:20px;margin:0}.chip b{font-size:13.5px}.chip small{display:none}
  .budget{border:0;padding:0;font-size:12px;order:-1;margin-inline-end:14px}.budget span{display:none}.budget b{font-size:15px}
  #mission.panel{justify-self:start;width:min(32vw,250px);padding:0;border-width:9px;border-image-width:9px}#mission b{font-size:14px}#mission span{font-size:10.5px;line-height:1.35}#goal{height:12px}#gc{font-size:11.5px}
  #alarm{justify-self:start;width:min(32vw,250px);box-sizing:border-box;font-size:11px;padding:5px 8px}
  #toast{inset-inline:auto;top:50px;bottom:auto;left:max(12px,env(safe-area-inset-left,0px));text-align:left;width:min(40vw,330px)}
  #toast span{font-size:12.5px;padding:7px 12px}
  #ctx{bottom:max(12px,env(safe-area-inset-bottom,0px))}
  .primary{min-height:44px;font-size:14px}.panel{border-width:10px}
  #scrim{align-items:stretch;justify-content:flex-start}
  #frame{width:min(60vw,500px);max-height:none;height:100%;border-width:28px 28px 20px}#crown{display:none}#sheet{margin-top:0}.tabs button{min-height:50px}
  .cine .bar{height:9%}
  #caption{bottom:12%;font-size:22px}
  #skip{top:calc(4px + env(safe-area-inset-top,0px))}
  #titlecard h1{font-size:clamp(56px,24vh,104px)}
  #dlg{inset:auto auto max(8px,env(safe-area-inset-bottom,0px)) 50%;transform:translateX(-50%);width:min(72vw,620px);padding:0;gap:6px}
  #dlg .por{width:64px;height:64px}#dlg p{font-size:14px;line-height:1.5}#dlg .who{font-size:16px}
  #close .wrap{width:min(92vh,70vw)}
  #close p{font-size:22px;inset:auto 0 5%}
}
</style>

<div id="app" dir="rtl" lang="ar">
  <canvas id="c" aria-label="اسحب بإصبعك في أي مكان عشان تمشي"></canvas>
  <div id="top" hidden><div id="hud" class="panel"></div><div id="alarm" hidden></div><div id="mission" class="panel"></div></div>
  <div id="toast" hidden><span class="panel"></span></div>
  <div id="ctx"></div>
  <div class="bar" id="barT"></div><div class="bar" id="barB"></div>
  <div id="caption" hidden></div>
  <div id="flash"></div>
  <div id="titlecard" hidden><h1>أول برميل</h1></div>
  <button id="skip" hidden>تخطّي</button>
  <div id="dlg" class="panel" hidden></div>
  <div id="close" hidden></div>
  <div id="scrim" hidden><div id="frame"><img id="crown" alt=""><div id="sheet"></div></div></div>
</div>

function collide(){Object.keys(B).forEach(id=>{const b=B[id];if(!S.built[id]||b.pass||(id==='yard'&&S.tier===0))return;const f=foot(id),dx=S.px-b.x,dy=S.py-b.y,ox=f.fx+4-Math.abs(dx),oy=f.fy+3-Math.abs(dy);if(ox>0&&oy>0){if(ox<oy)S.px+=dx<0?-ox:ox;else S.py+=dy<0?-oy:oy}})}
function move(dt){let dx=0,dy=0;
  if(joy){const m=Math.hypot(joy.dx,joy.dy);if(m>7){const k=Math.min(1,m/42);dx=joy.dx/m*k;dy=joy.dy/m*k}}
  if(keys.ArrowLeft)dx=-1;if(keys.ArrowRight)dx=1;if(keys.ArrowUp)dy=-1;if(keys.ArrowDown)dy=1;
  const sp=S.rideF?150+12*lv('forklift'):96;moving=!!(dx||dy);
  if(moving){const bx=S.wallLv?[WALLR.x0+12,WALLR.x1-12,WALLR.y0+14,WALLR.y1-10]:[20,980,30,900];S.px=Math.max(bx[0],Math.min(bx[1],S.px+dx*sp*dt));S.py=Math.max(bx[2],Math.min(bx[3],S.py+dy*sp*dt));const q=dirOf(dx,dy);pdir=q[0];pflip=q[1];walkT+=dt*9}else walkT=0;collide();if(S.wallLv){S.px=Math.max(WALLR.x0+12,Math.min(WALLR.x1-12,S.px));S.py=Math.max(WALLR.y0+14,Math.min(WALLR.y1-10,S.py))}
}
function sim(dt){
  S.played+=dt;actT+=dt;payT+=dt;swing=Math.max(0,swing-dt*4);const tick=actT>.36;if(tick)actT=0;const payTick=payT>.1;if(payTick)payT=0;
  const pow=(has('shop')?2:1)+lv('shop');

  if(has('yard')&&nearB('yard',24)&&S.carry>0&&S.stored<cap()&&tick){const n=Math.min(S.carry,cap()-S.stored);S.carry-=n;S.stored+=n;float(B.yard.x,B.yard.y-50,'+'+fmt(n)+' مخزون')}
  if(has('dock')&&nearB('dock',20)&&S.stored>=1&&tick){const n=Math.min(Math.floor(S.stored),2+Math.floor(S.stored/20));S.stored-=n;const got=sell(n);float(B.dock.x,B.dock.y-50,'+'+fmt(got)+' ريال','#ffc933')}

  /* billboards: stand at the slot to build, the first month pays on completion */

  monthly(dt);investors(dt);threat(dt);

function upgradeTier(){if(S.tier>=4)return;const c=TIERS[S.tier+1].c;if(!Object.keys(c).every(k=>S[k]>=c[k]))return;for(const k in c){S[k]-=c[k];if(k==='money')S.led.out+=c[k]}S.tier++;shake=reduce?0:4;toast('صار عندك '+TIERS[S.tier].n+' بسعة '+fmt(TIERS[S.tier].cap)+' برميل.');ctxBtn.s=null;save()}

function goTo(s,x,y,dt){const d=dist(s.x,s.y,x,y);if(d<14){s.mv=0;return true}const sp=(48+s.skill*10)*(hungry(s)&&S.breakT<=0?.5:1),dx=(x-s.x)/d,dy=(y-s.y)/d;s.x+=dx*sp*dt;s.y+=dy*sp*dt;const q=dirOf(dx,dy);s.dir=q[0];s.flip=q[1];s.mv=1;s.w=(s.w||0)+dt*8;return false}
const nearIn=(s,list,f)=>{let b=null,m=1e9;list.forEach(t=>{if(f(t)){const k=dist(t.x,t.y,s.x,s.y);if(k<m){m=k;b=t}}});return b};
function workers(dt){
  if(has('farm')){S.herdT-=dt;if(S.herdT<=0&&S.herd<14){S.herd++;S.herdT=35}S.food=Math.min(200,S.food+(.15+S.herd*.09)*(1+.3*lv('farm'))*dt)}
  S.staff.forEach(s=>{if(s.away)return;if(s.x===undefined){s.x=B.office.x;s.y=B.office.y+36}
    if(S.breakT>0&&has('farm')){if(goTo(s,KITCHEN.x-30+(s.id%5)*16,KITCHEN.y+12,dt)&&s.fed===0&&S.food>=2){S.food-=2;s.fed=1;float(s.x,s.y-44,'أكل','#b5e8bd')}return}
    s.t=(s.t||0)+dt*(.55+s.skill*.22)*(hungry(s)?.5:1);const beat=()=>{if(s.t>=1){s.t=0;return true}return false};
    switch(s.role){
      case'wood':{const t=nearIn(s,S.trees,x=>x.st==='t');if(t&&goTo(s,t.x+10,t.y+6,dt)&&beat()){const n=(has('shop')?2:1)+lv('shop');S.wood+=n;t.hp--;burst(t.x,t.y-14,3,'#8c5a36',30);if(t.hp<=0)t.st='s'}break}
      case'stone':{const r=nearIn(s,S.rocks,x=>x.hp>0);if(S.built.shop&&r&&goTo(s,r.x+12,r.y+6,dt)&&beat()){S.stone+=2;r.hp--;if(r.hp<=0)r.t=45}break}
      case'plant':{if(!has('nursery'))break;if(S.water<1){if(goTo(s,WATER.x+30,WATER.y+10,dt)&&beat())S.water=Math.min(20,S.water+3)}else{const t=nearIn(s,S.trees,x=>x.st==='s');if(t&&goTo(s,t.x,t.y+6,dt)&&beat()){S.water--;t.st='g';t.t=28*(1-.12*lv('nursery'));S.planted++}}break}
      case'barrel':{if(has('shop')&&goTo(s,B.shop.x,B.shop.y+26,dt)&&beat()&&S.wood>=1&&S.empty<200){S.wood--;S.empty++}break}
      case'haul':{if(!s.load){if(has('derrick')&&S.empty>0&&goTo(s,WELL.x+22,WELL.y+22,dt)&&beat()){const n=Math.min(S.empty,2+s.skill);S.empty-=n;s.load=n}}else if(has('yard')&&goTo(s,B.yard.x+6,B.yard.y+20,dt)&&S.stored<cap()){const n=Math.min(s.load,cap()-S.stored);S.stored+=n;s.load-=n}break}
      case'sell':{if(!s.load){if(has('yard')&&S.stored>=1&&goTo(s,B.yard.x-14,B.yard.y+20,dt)){const n=Math.min(Math.floor(S.stored),4+s.skill*2);S.stored-=n;s.load=n}}else if(has('dock')&&goTo(s,B.dock.x,B.dock.y+26,dt)){const got=sell(s.load);float(B.dock.x,B.dock.y-46,'+'+fmt(got)+' ريال','#ffc933');s.load=0}break}
      case'radar':{if(!has('radar'))break;goTo(s,B.radar.x+22,B.radar.y+24,dt);s.rc=(s.rc||0)-dt;const d=drones.find(x=>x.seen);if(d&&s.rc<=0){s.rc=Math.max(1,3.5-s.skill*.5);if(shootAt(d,s.skill))toast(s.name+' اعترض الهدف من الرادار.')}break}
      case'eng':if(has('pump'))goTo(s,B.pump.x+24,B.pump.y+18,dt);break;
      case'fire':{const f=Object.keys(S.fires)[0],b=f?B[f]:B.fire;if(S.built.fire||f)goTo(s,b.x+16,b.y+28,dt);break}

    }});
}
function threatTarget(){const spies=S.staff.some(s=>s.spy),list=Object.keys(S.built).filter(id=>S.hp[id]>0&&id!=='forklift');if(spies&&S.hp.yard>0&&Math.random()<.6)return'yard';return list[Math.floor(Math.random()*list.length)]}
function launch(){const t=threatTarget();if(!t)return;const a=Math.random()*6.28,d={id:S.nid++,x:500+Math.cos(a)*720,y:480+Math.sin(a)*720,t,sp:24+S.attacks*1,seen:has('radar'),missile:S.attacks>2&&Math.random()<.35};if(d.missile)d.sp*=1.7;drones.push(d);S.attacks++;if(d.seen)toast('الرادار رصد هدف جاي. روح للرادار بنفسك.')}

async function walkTo(a,x,y,speed){a.moving=true;return new Promise(res=>{const st=()=>{if(!cineAlive)return res();const d=dist(a.x,a.y,x,y);if(d<2){a.moving=false;return res()}const dt=.016,dx=(x-a.x)/d,dy=(y-a.y)/d;a.x+=dx*speed*dt;a.y+=dy*speed*dt;a.walk=(a.walk||0)+dt*8;if(a.dir!==undefined){const q=dirOf(dx,dy);a.dir=q[0];a.flip=q[1]}setTimeout(st,16)};st()})}
async function cinematic(){
  cineAlive=true;$('app').classList.add('cine');$('skip').hidden=false;cam.manual=true;
  A.show=true;K.show=true;A.x=250;A.y=490;K.x=222;K.y=496;A.dir='e';K.flip=false;
  cam.x=250;cam.y=470;cam.z=baseZ*.85;camTo(330,470,baseZ*.85,.4);
  cap_('ثلاث أيام في الصحراء.');K.moving=true;
  const kw=walkTo(K,INTRO_TREE.x-90,INTRO_TREE.y+26,40);const aw=walkTo(A,INTRO_TREE.x-50,INTRO_TREE.y+20,40);
  await wait(2600);if(!cineAlive)return;cap_('الناقة تعبانة، والقربة ما بقى فيها إلا قطرة وحدة.');camTo(INTRO_TREE.x-40,INTRO_TREE.y,baseZ*.95,.5);
  await aw;await kw;if(!cineAlive)return;A.dir='e';A.flip=false;cap_('');
  await wait(300);camTo(A.x+4,A.y-16,baseZ*3,1.1);cap_('شجرة... وظل أخيرًا.');await wait(2000);if(!cineAlive)return;
  cap_('آخر قطرة.');A.pose='drink';await wait(800);cineFx.drop=1;const dI=setInterval(()=>{cineFx.drop=Math.max(0,cineFx.drop-.05)},50);await wait(1500);clearInterval(dI);cineFx.drop=0;A.pose=null;if(!cineAlive)return;
  cap_('... وش ذا الصوت؟');for(let i=0;i<20&&cineAlive;i++){shake=reduce?0:2+i*.35;await wait(90)}if(!cineAlive)return;
  camTo(WELL.x+30,WELL.y-34,baseZ*1.15,2.4);cap_('');for(let i=0;i<14&&cineAlive;i++){cineFx.cracks=i/14;shake=reduce?0:6;await wait(50)}if(!cineAlive)return;
  /* the blowout */
  const fl=$('flash');fl.style.transition='none';fl.style.opacity='1';setTimeout(()=>{fl.style.transition='opacity 1s';fl.style.opacity='0'},60);
  shake=reduce?0:24;cineFx.cracks=0;cineFx.gush=2;cineFx.pool=.6;const pI=setInterval(()=>{cineFx.pool=Math.min(1,cineFx.pool+.02)},80);
  camTo(WELL.x+20,WELL.y-70,baseZ*.8,1.4);await wait(700);if(cineAlive)$('titlecard').hidden=false;await wait(2500);$('titlecard').hidden=true;clearInterval(pI);cineFx.pool=1;if(!cineAlive)return;
  /* the khawaja */
  cineFx.gush=1;Jp.show=true;Jp.x=WELL.x-210;Jp.y=WELL.y+66;camTo(WELL.x-30,WELL.y+10,baseZ*1.2,.9);cap_('وما مرّت ساعة، إلا وفيه أحد جاي.');
  await walkTo(Jp,WELL.x-70,WELL.y+66,70);if(!cineAlive)return;cap_('');N.show=true;N.x=Jp.x+14;N.y=Jp.y+8;N.dir='e';N.flip=false;
  await walkTo(A,WELL.x+36,WELL.y+66,44);await walkTo(N,WELL.x-4,WELL.y+66,36);if(!cineAlive)return;N.dir='e';N.flip=false;A.dir='e';A.flip=true;camTo(WELL.x+16,WELL.y+40,baseZ*2,1.2);$('skip').hidden=true;await wait(500);
  say('الخواجة','p_khawaja','Hello يا شيخ! هذا الشي الأسود... ما ينفع لك في شي. بس أنا أبغاه. بكم تبيع لي البرميل؟',[{l:'بريال واحد',f(){pick(1)}},{l:'بريالين',f(){pick(2)}}]);
}
function pick(p){S.price=p;S.startPrice=p;say('الخواجة','p_khawaja',(p===1?'ريال؟':'ريالين؟')+' ... Deal! اتفقنا يا صديقي. كل ما تعبّي، أجي آخذه.',[{l:'اتفقنا',f(){$('dlg').hidden=true;closeUp()}}])}
function closeUp(){const c=$('close');c.hidden=false;c.style.opacity='1';c.innerHTML='<div class="wrap"><img alt="عبدالله" src="'+ART.p_abdullah+'"><i style="right:58%;top:32%"></i><i style="right:36%;top:32%"></i></div><p>'+(S.price===1?'ريال لكل برميل؟':'ريالين لكل برميل؟')+'<br>الحين صرنا أغنياء.</p>';
  setTimeout(()=>{c.style.opacity='0';setTimeout(()=>{c.hidden=true;c.innerHTML='';startPlay()},900)},4200)}
function startPlay(){cineAlive=false;$('caption').hidden=true;$('flash').style.opacity='0';S.scene='play';cam.manual=false;cineFx.gush=0;parts=[];A.show=K.show=Jp.show=N.show=false;$('app').classList.remove('cine');cap_('');['dlg','skip','titlecard'].forEach(i=>$(i).hidden=true);$('top').hidden=false;S.px=WELL.x+30;S.py=WELL.y-48;cam.x=S.px;cam.y=S.py;cam.z=baseZ;save();toast('اسحب إصبعك في أي مكان عشان تمشي.')}
$('skip').addEventListener('click',()=>{cineAlive=false;S.price=1;S.startPrice=1;startPlay()});

/* ---------- Loop ---------- */
function frame(now){const ar=$('app');if(Math.abs(ar.clientWidth-W)>1||Math.abs(ar.clientHeight-H)>1)resize();const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  if(S.scene==='play'&&$('dlg').hidden){move(dt);sim(dt)}
  render(dt);
  if(S.scene==='play'){uiT+=dt;if(uiT>.12){uiT=0;hud();liveSheet()}saveT+=dt;if(saveT>4){saveT=0;save()}}
  requestAnimationFrame(frame)}
syncFork();resize();
if(S.scene==='play'){$('top').hidden=false;cam.manual=false;cam.x=S.px;cam.y=S.py;cam.z=baseZ}else cinematic();
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
requestAnimationFrame(frame);
})();
</script>
